<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>mac-dev-cleanup · 清理控制台</title>
<style>
:root{
  --bg:#fafafa; --panel:#ffffff; --border:#e4e4e7; --text:#18181b; --muted:#71717a;
  --subtle:#a1a1aa; --row:#ffffff; --row-hover:#f4f4f5; --accent:#18181b; --accent-inv:#ffffff;
  --track:#f4f4f5; --bar:#d4d4d8;
  --indigo:#4f46e5; --emerald:#059669; --amber:#d97706; --rose:#e11d48; --violet:#7c3aed; --sky:#0284c7; --slate:#64748b;
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#09090b; --panel:#18181b; --border:#27272a; --text:#fafafa; --muted:#a1a1aa;
    --subtle:#52525b; --row:#18181b; --row-hover:#1f1f23; --accent:#fafafa; --accent-inv:#09090b;
    --track:#27272a; --bar:#3f3f46;
    --indigo:#818cf8; --emerald:#10b981; --amber:#f59e0b; --rose:#f43f5e; --violet:#a78bfa; --sky:#38bdf8; --slate:#94a3b8;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:14px; line-height:1.5; min-height:100vh;
  -webkit-text-size-adjust:100%;
  scrollbar-width:thin; scrollbar-color:var(--bar) transparent;
}
/* themed scrollbars (replaces native) */
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent;margin:4px 0}
::-webkit-scrollbar-thumb{background:var(--bar);border-radius:999px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--subtle)}
::-webkit-scrollbar-corner{background:transparent}
a{color:var(--indigo)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.tnum{font-variant-numeric:tabular-nums}
.wrap{max-width:1080px;margin:0 auto;padding:24px 16px 48px}
@media(min-width:640px){.wrap{padding:28px 24px 56px}}

/* top bar */
.topbar{
  position:sticky; top:0; z-index:50;
  background:var(--panel); border-bottom:1px solid var(--border);
}
.topbar-in{max-width:1080px;margin:0 auto;padding:0 16px;height:56px;display:flex;align-items:center;justify-content:space-between;gap:12px}
@media(min-width:640px){.topbar-in{padding:0 24px}}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:20px;height:20px;flex:0 0 auto;color:var(--text)}
.brand h1{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;font-weight:600;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .dim{color:var(--subtle);font-weight:400}
.meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;flex:0 0 auto}
.meta .sep{color:var(--subtle)}
.meta .pill{display:none;align-items:center;gap:6px}
@media(min-width:640px){.meta .pill{display:inline-flex}}
.dot{width:7px;height:7px;border-radius:50%;background:var(--subtle)}
.dot.on{background:var(--emerald)}
.btn{height:32px;padding:0 12px;border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:7px;font-size:13px;font-weight:500;cursor:pointer;transition:background .15s}
.btn:hover{background:var(--row-hover)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--accent);color:var(--accent-inv);border-color:var(--accent)}
.btn.primary:hover{opacity:.9}
.btn.busy{opacity:.7;cursor:default}

/* sections → unified collapsible panels */
.section{margin-top:16px}
@media(min-width:640px){.section{margin-top:24px}}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.panel-head{
  display:flex;align-items:center;gap:8px;width:100%;
  padding:12px 16px;background:var(--row-hover);
  border-bottom:1px solid var(--border);cursor:pointer;user-select:none;
}
.panel-head:hover{background:var(--track)}
.panel-head:focus-visible{outline:2px solid var(--indigo);outline-offset:-2px}
.panel-head h2{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0;flex:0 0 auto}
.panel-head .note{font-size:11px;color:var(--subtle);margin-left:auto;text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.panel-head .note .view-toggle{display:inline-flex;align-items:center;gap:3px;margin-left:6px;font-size:10px;color:var(--subtle);background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:1px 5px;cursor:pointer;line-height:1.4;vertical-align:middle}
.panel-head .note .view-toggle:hover{color:var(--text);background:var(--row-hover)}
.panel-head .chev{font-size:15px;color:var(--subtle);transition:transform .2s;flex:0 0 auto;margin-left:8px}
.panel-head .chev.open{transform:rotate(90deg)}
.drag-handle{cursor:grab;font-size:14px;color:var(--subtle);flex:0 0 auto;margin-right:2px;line-height:1;touch-action:none}
.drag-handle:active{cursor:grabbing}
.panel.dragging{opacity:.5;border:2px dashed var(--indigo);border-radius:var(--radius)}
.panel.drag-over{box-shadow:inset 0 3px 0 0 var(--indigo)}
.panel-body{padding:16px}
.panel-body.no-pad{padding:0}
@media(max-width:639px){
  .panel-head{padding:11px 14px}
  .panel-body{padding:12px 14px}
  .panel-body.no-pad{padding:0}
}
/* legacy sec-head kept for non-panel callers */
.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px;padding:0 2px}
.sec-head h2{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.sec-head .note{font-size:11px;color:var(--subtle)}

.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}

/* summary grid */
.grid{display:grid;gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.grid.cols-2{grid-template-columns:1fr 1fr}
.grid.cols-3{grid-template-columns:1fr 1fr}
@media(min-width:640px){.grid.cols-3{grid-template-columns:1fr 1fr 1fr}}
.grid.cols-4{grid-template-columns:1fr 1fr}
@media(min-width:640px){.grid.cols-4{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.grid.cols-4{grid-template-columns:repeat(6,1fr)}}
.sum-cell{background:var(--panel);padding:14px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
@media(max-width:639px){.sum-cell{padding:10px 14px}}
.sum-cell .lbl{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--subtle)}
.sum-cell .val{font-size:22px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
@media(max-width:639px){.sum-cell .val{font-size:17px}}
.sum-cell .sub{font-size:11px;color:var(--muted)}
.c-indigo{color:var(--indigo)} .c-emerald{color:var(--emerald)} .c-amber{color:var(--amber)} .c-rose{color:var(--rose)} .c-slate{color:var(--slate)}

/* risk bar */
.risk-bar{height:6px;border-radius:6px;background:var(--track);display:flex;overflow:hidden;margin-bottom:12px}
.risk-bar>span{height:100%;transition:width .3s}
/* single-row hover switch (risk / cat compact mode) */
.cr-single{position:relative;padding:10px 16px;min-height:36px}
.cr-item{display:none;align-items:center;gap:10px;cursor:pointer;transition:opacity .12s}
.cr-item.cr-active{display:flex}
.cr-single:hover .cr-item{display:flex}
.cr-single:hover .cr-item.cr-active{display:none}
.cr-item:hover .cr-label{color:var(--text);font-weight:600}
.cr-item .cr-dot{width:8px;height:8px;border-radius:2px;flex:0 0 auto}
.cr-item .cr-label{font-size:13px;font-weight:500;flex:0 0 auto;white-space:nowrap}
.cr-item .cr-meter{width:60px;height:4px;border-radius:4px;background:var(--track);overflow:hidden;flex:1 1 auto}
@media(min-width:640px){.cr-item .cr-meter{width:100px}}
.cr-item .cr-meter>span{display:block;height:100%;border-radius:4px}
.cr-item .cr-val{font-family:ui-monospace,monospace;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right;flex:0 0 auto;min-width:56px}
.cr-item .cr-pct{font-family:ui-monospace,monospace;font-size:10px;color:var(--subtle);width:32px;text-align:right;flex:0 0 auto}
.cr-item .cr-desc{font-size:11px;color:var(--subtle);margin-left:auto;white-space:nowrap;flex:0 0 auto}
/* disk compact row */
.risk-rows{display:grid;grid-template-columns:1fr;gap:12px;padding:4px 0}
@media(min-width:640px){.risk-rows{grid-template-columns:repeat(3,1fr)}}
.risk-row{display:flex;align-items:flex-start;gap:8px;padding:6px 16px;border-radius:var(--radius-sm)}
.risk-row .sw{width:8px;height:8px;border-radius:2px;margin-top:6px;flex:0 0 auto}
.risk-row .rn{font-size:13px;font-weight:500}
.risk-row .rd{font-size:11px;color:var(--subtle);margin-top:2px;line-height:1.35}
.risk-row .rs{margin-left:auto;text-align:right;flex:0 0 auto}
.risk-row .rs .sz{font-family:ui-monospace,monospace;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.risk-row .rs .pc{font-family:ui-monospace,monospace;font-size:10px;color:var(--subtle)}
/* list view: cat rows with meters */
.cat-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 18px;border-bottom:1px solid var(--border)}
.cat-row:last-child{border-bottom:none}
.cat-row .cl{font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-row .cr{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.cat-row .meter{width:40px;height:4px;border-radius:4px;background:var(--track);overflow:hidden}
@media(min-width:640px){.cat-row .meter{width:80px}}
.cat-row .meter>span{display:block;height:100%;border-radius:4px;background:var(--bar)}
.cat-row .cs{font-family:ui-monospace,monospace;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;width:56px;text-align:right}
.cat-row .cp{font-family:ui-monospace,monospace;font-size:10px;color:var(--subtle);width:32px;text-align:right}
/* disk compact */
.disk-compact{display:flex;align-items:center;gap:14px;padding:10px 16px;flex-wrap:wrap}
.disk-compact .dc-metric{text-align:center;min-width:60px}
.disk-compact .dc-metric .dc-val{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.disk-compact .dc-metric .dc-lbl{font-size:10px;color:var(--subtle);text-transform:uppercase;letter-spacing:.04em}
.disk-compact .dc-bar{flex:1 1 120px;height:6px;border-radius:6px;background:var(--track);overflow:hidden;min-width:80px}
.disk-compact .dc-bar>span{display:block;height:100%;border-radius:6px}
.disk-compact .dc-est{font-size:12px;color:var(--emerald);font-weight:600;white-space:nowrap}
/* list view (grid card style for risk/cat) */
.view-list .risk-grid{display:grid;grid-template-columns:1fr;gap:10px;padding:4px 16px 12px}
@media(min-width:640px){.view-list .risk-grid{grid-template-columns:repeat(3,1fr)}}
.view-list .risk-card{background:var(--row-hover);border-radius:var(--radius-sm);padding:12px 14px;cursor:pointer;transition:background .15s;border:1px solid transparent}
.view-list .risk-card:hover{background:var(--track);border-color:var(--border)}
.view-list .risk-card .rc-top{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.view-list .risk-card .rc-dot{width:10px;height:10px;border-radius:3px}
.view-list .risk-card .rc-name{font-size:14px;font-weight:600}
.view-list .risk-card .rc-val{margin-left:auto;font-family:ui-monospace,monospace;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.view-list .risk-card .rc-desc{font-size:11.5px;color:var(--subtle);line-height:1.4}
.view-list .risk-card .rc-bar{height:4px;border-radius:4px;background:var(--track);overflow:hidden;margin-top:8px}
.view-list .risk-card .rc-bar>span{display:block;height:100%;border-radius:4px}
.view-list .cat-grid{display:grid;grid-template-columns:1fr;gap:8px;padding:4px 16px 12px}
@media(min-width:640px){.view-list .cat-grid{grid-template-columns:repeat(2,1fr)}}
.view-list .cat-card{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--row-hover);border-radius:var(--radius-sm);cursor:pointer;transition:background .15s;border:1px solid transparent}
.view-list .cat-card:hover{background:var(--track);border-color:var(--border)}
.view-list .cat-card .cc-dot{width:8px;height:8px;border-radius:2px;flex:0 0 auto}
.view-list .cat-card .cc-name{font-size:13px;font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.view-list .cat-card .cc-bar{width:60px;height:4px;border-radius:4px;background:var(--track);overflow:hidden;flex:0 0 auto}
@media(min-width:640px){.view-list .cat-card .cc-bar{width:100px}}
.view-list .cat-card .cc-bar>span{display:block;height:100%;border-radius:4px}
.view-list .cat-card .cc-val{font-family:ui-monospace,monospace;font-size:12px;font-weight:600;min-width:50px;text-align:right;flex:0 0 auto}
.clickable{cursor:pointer;transition:background .15s}
.clickable:hover{background:var(--row-hover)}
.clickable:focus-visible{outline:2px solid var(--indigo);outline-offset:-2px}

/* cat list */
.cat-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 18px;border-bottom:1px solid var(--border)}
.cat-row:last-child{border-bottom:none}
@media(max-width:639px){.cat-row{padding:9px 14px}}
.cat-row .cl{font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-row .cr{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.cat-row .meter{width:40px;height:4px;border-radius:4px;background:var(--track);overflow:hidden}
@media(min-width:640px){.cat-row .meter{width:80px}}
.cat-row .meter>span{display:block;height:100%;border-radius:4px;background:var(--bar)}
.cat-row .cs{font-family:ui-monospace,monospace;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;width:56px;text-align:right}
.cat-row .cp{font-family:ui-monospace,monospace;font-size:10px;color:var(--subtle);width:32px;text-align:right}

/* tools */
.tool-cell{background:var(--panel);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-height:60px}
.tool-cell .tn{font-family:ui-monospace,monospace;font-size:12px;font-weight:600}
.tool-cell .tt{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--subtle)}
.tool-cell .ts{font-size:11px;font-weight:600;font-family:ui-monospace,monospace;margin-top:auto}
.tool-cell .ts.ok{color:var(--emerald)} .tool-cell .ts.miss{color:var(--subtle)}
.tool-cell .thint{display:block;font-size:9.5px;font-weight:400;font-family:inherit;color:var(--subtle);opacity:.85;margin-top:2px}
.tool-install{margin-top:auto;font-size:9.5px;padding:2px 6px;border:1px solid var(--border);border-radius:4px;background:var(--panel);color:var(--subtle);cursor:pointer;font-family:inherit;line-height:1.3}
.tool-install:hover{color:var(--text);background:var(--row-hover)}

/* disk */
.pre{font-family:ui-monospace,monospace;font-size:11px;line-height:1.6;color:var(--muted);white-space:pre-wrap;word-break:break-all;margin:0}
.disk-cell{background:var(--panel);padding:14px 18px}
@media(max-width:639px){.disk-cell{padding:12px 14px}}
.disk-cell h4{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--subtle);margin:0 0 6px}
/* disk grid stacks on mobile */
.disk-grid{display:grid;gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;grid-template-columns:1fr}
.disk-grid.disk-single{grid-template-columns:1fr}
@media(min-width:640px){.disk-grid:not(.disk-single){grid-template-columns:1fr 1fr}}
.disk-metrics{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.dm-row{display:flex;justify-content:space-between;align-items:center;font-size:12px}
.dm-label{color:var(--muted)}
.dm-val{font-family:ui-monospace,monospace;font-weight:600;font-variant-numeric:tabular-nums}
.dm-pct{color:var(--amber)}
.dm-bar{height:6px;border-radius:6px;background:var(--track);overflow:hidden}
.dm-fill{height:100%;border-radius:6px;background:var(--bar);transition:width .3s}
.df-detail{font-size:11px;color:var(--subtle)}
.df-detail summary{cursor:pointer;padding:4px 0}
.df-detail summary:hover{color:var(--text)}

/* table */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border);background:var(--row-hover)}
.search{position:relative;flex:1 1 160px;min-width:160px;max-width:380px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--subtle)}
.search input{width:100%;height:36px;padding:0 12px 0 32px;font-size:14px;background:var(--panel);border:1px solid var(--border);border-radius:7px;color:var(--text);outline:none}
@media(min-width:640px){.search input{font-size:13px}}
.search input:focus{border-color:var(--subtle)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{height:32px;padding:0 12px;border:1px solid var(--border);background:var(--panel);color:var(--muted);border-radius:999px;font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;font-variant-numeric:tabular-nums}
.chip:hover{background:var(--row-hover)}
.chip.active{background:var(--accent);color:var(--accent-inv);border-color:var(--accent)}
.count{font-size:11px;color:var(--subtle);font-variant-numeric:tabular-nums;margin-left:auto;flex:0 0 auto;text-align:right}
@media(max-width:639px){.count{width:100%;text-align:left;margin-left:0}}
.scroll{max-height:70vh;overflow:auto}
@media(min-width:640px){.scroll{max-height:600px}}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:680px}
thead th{position:sticky;top:0;background:var(--row-hover);border-bottom:1px solid var(--border);padding:10px 12px;text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);white-space:nowrap;z-index:5}
thead th[data-sort]{cursor:pointer;user-select:none}
thead th[data-sort]:hover{color:var(--text)}
thead th.sort-active{color:var(--text)}
tbody td{padding:8px 12px;border-bottom:1px solid var(--border);vertical-align:top}
tbody tr:hover{background:var(--row-hover)}
td.sz{font-family:ui-monospace,monospace;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
td.path{font-family:ui-monospace,monospace;font-size:11.5px;color:var(--muted);word-break:break-all;line-height:1.6}
td.reason{font-size:11.5px;color:var(--subtle);line-height:1.5;max-width:240px}
.row-actions{display:flex;gap:4px}
.ra-btn{width:22px;height:22px;border:1px solid var(--border);border-radius:4px;background:var(--panel);color:var(--subtle);cursor:pointer;font-size:11px;display:inline-flex;align-items:center;justify-content:center;padding:0}
.ra-btn:hover{color:var(--text);background:var(--row-hover)}
.hide-sm{display:none}
@media(min-width:640px){.hide-sm{display:table-cell}}
/* responsive: table on desktop, cards on small screens (no horizontal scroll) */
.tview{display:block}
.cview{display:none}
@media(max-width:639px){
  table{min-width:0}
  .scroll{max-height:70vh}
  .tview{display:none}
  .cview{display:block;max-height:70vh;overflow:auto;border-top:1px solid var(--border)}
}
.ccard{border-bottom:1px solid var(--border);padding:12px 12px;display:flex;flex-direction:column;gap:7px}
.ccard:last-child{border-bottom:none}
.ccard-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ccard-head .sz{font-family:ui-monospace,monospace;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.ccat{font-family:ui-monospace,monospace;font-size:11px;color:var(--subtle)}
.cpath{font-family:ui-monospace,monospace;font-size:11.5px;color:var(--muted);word-break:break-all;line-height:1.55}
.creason{font-size:11.5px;color:var(--subtle);line-height:1.5}

.tag{display:inline-flex;align-items:center;padding:1px 8px;border-radius:6px;font-size:11px;font-weight:600;white-space:nowrap}
.tag-safe{background:rgba(5,150,105,.13);color:#047857}
.tag-aggressive{background:rgba(217,119,6,.15);color:#b45309}
.tag-manual{background:rgba(225,29,72,.13);color:#be123c}
.tag-scanonly{background:rgba(100,116,139,.15);color:#475569}
.tag-would{background:rgba(217,119,6,.15);color:#b45309}
.tag-deleted{background:rgba(5,150,105,.13);color:#047857}
.tag-review{background:rgba(225,29,72,.13);color:#be123c}

<script>
(function(){

  // Order matters: longer / more specific patterns first.
  var REASON_RULES = [
    [/^Tauri generated tree \(regenerated by cargo build\): (.+)$/, "Tauri 生成目录（cargo build 自动重建）：$1"],
    [/^Tauri\/Rust build directory: (.+)$/, "Tauri/Rust 构建目录：$1"],

    [/^Apple Photos library; personal media, do not auto-delete$/, "Apple 照片图库：个人媒体，不会自动删除"],

  function zh(k){ return L[k] || k; }
  function zhReason(s){
    s = String(s==null?"":s);
    if(!s) return "";
    for(var i=0;i<REASON_RULES.length;i++){
      var m = REASON_RULES[i][0].exec(s);
      if(m){
        return REASON_RULES[i][1].replace(/\$(\d)/g, function(_, d){ return m[+d] || ""; });
      }

    return s;
  }

  var toastTimer = null;
  function toast(msg, kind){
    var el = $("toast");
    if(!el) return;
    el.textContent = msg;
    el.className = "toast show" + (kind ? " " + kind : "");
    if(toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.className = "toast" + (kind ? " " + kind : ""); }, 2600);
  }
  function copyText(text, okMsg){
    if(!navigator.clipboard){ toast("当前环境不支持剪贴板", "err"); return; }
    navigator.clipboard.writeText(text).then(function(){
      toast(okMsg || "已复制到剪贴板", "ok");
    }).catch(function(){ toast("复制失败", "err"); });
  }
  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }
  function truncatePath(p){
    if(!p) return "";
    var sep = p.indexOf("/")===0 ? "/" : "";
    var parts = p.replace(/^\/|\/$/g,"").split("/");
    if(parts.length<=3) return p;
    return sep + "…" + sep + parts.slice(-3).join(sep);
  }
  function fmt(n){ return (n==null?0:n); }
  function pct(part, total){
    if(!total) return 0;
    return Math.round((part/total)*1000)/10;
  }
  var RISK_TAG = { safe:"tag-safe", aggressive:"tag-aggressive", manual:"tag-manual" };
  var ACT_TAG = {
    "scan only":"tag-scanonly", "would delete":"tag-would", deleted:"tag-deleted",
    "needs review":"tag-review", failed:"tag-failed"
  };
  var RISK_META = {
    safe:{cls:"tag-safe", sw:"var(--emerald)", label:"安全", desc:"扫描即安全，可随模式自动清理"},
    aggressive:{cls:"tag-aggressive", sw:"var(--amber)", label:"谨慎", desc:"默认不删，需显式启用或人工确认"},
    manual:{cls:"tag-manual", sw:"var(--rose)", label:"待确认", desc:"涉及项目源码/个人文件，永不自动删"}
  };
  var CAT_COLORS = ["var(--indigo)","var(--emerald)","var(--amber)","var(--violet)","var(--sky)","var(--rose)","var(--slate)"];

  var state = { search:"", risk:"all", sortKey:"size", sortDir:-1,
    apiOnline:false, scanBusy:false, saveBusy:false,
    status:"", statusCls:"idle", cmdOut:"", showCmd:false, hasDraft:false };

  // ---- unified collapsible panels ----
  // Collapse state is remembered across sessions via localStorage.
  var PANEL_DEFAULTS = { summary:true, risk:true, cat:false, tools:false,
    disk:false, table:true, cleanup:true, ops:false, settings:false };
  var PANELS = Object.assign({}, PANEL_DEFAULTS);
  try{
    var savedPanels = JSON.parse(localStorage.getItem("mdc.panels")||"null");
    if(savedPanels && typeof savedPanels==="object"){
      for(var pk in PANEL_DEFAULTS){
        if(typeof savedPanels[pk]==="boolean") PANELS[pk]=savedPanels[pk];
      }
    }

  function savePanels(){
    try{ localStorage.setItem("mdc.panels", JSON.stringify(PANELS)); }catch(e){}
  }
  // panel(id, title, note, bodyHtml) — unified collapsible section shell.
  // bodyNoPad for sections that manage their own padding (tables/lists).
  // draggable panels get a drag handle.
  function panel(id, title, note, bodyHtml, bodyNoPad, draggable){
    var open = PANELS[id] !== false;
    var dragH = draggable !== false ? '<span class="drag-handle" title="拖拽排序">⠿</span>' : '';
    return '<section class="section panel" id="panel-'+esc(id)+'" draggable="'+(draggable!==false?"true":"false")+'" data-panel-id="'+esc(id)+'">'+
      '<div class="panel-head" data-panel="'+esc(id)+'" role="button" tabindex="0" '+
        'aria-expanded="'+(open?"true":"false")+'" aria-controls="pbody-'+esc(id)+'">'+
        dragH+'<h2>'+esc(title)+'</h2>'+
        (note?'<span class="note">'+note+'</span>':'')+
        '<span class="chev'+(open?" open":"")+'">›</span>'+
      '</div>'+
      '<div class="panel-body'+(bodyNoPad?" no-pad":"")+'" id="pbody-'+esc(id)+'" '+
        'style="display:'+(open?"block":"none")+'">'+bodyHtml+'</div>'+
    '</section>';
  }
  function togglePanel(id){
    if(!(id in PANELS)) return;
    PANELS[id] = !PANELS[id];
    savePanels();
    var body=$("pbody-"+id);
    if(body) body.style.display = PANELS[id] ? "block" : "none";
    var head=document.querySelector('[data-panel="'+id+'"]');
    if(head){
      var chev=head.querySelector(".chev");
      if(chev) chev.classList.toggle("open", PANELS[id]);
      head.setAttribute("aria-expanded", PANELS[id]?"true":"false");
    }

    if(id==="settings") state.settingsOpen = PANELS[id];

  function bindPanels(){
    var app=$("app");
    if(!app) return;
    app.addEventListener("click", function(e){
      var head=e.target.closest(".panel-head");
      if(!head) return;
      // Don't toggle when clicking interactive children inside the head
      if(e.target.closest("button")) return;
      if(e.target.closest(".view-toggle")) return;
      togglePanel(head.getAttribute("data-panel"));
    });
    app.addEventListener("keydown", function(e){
      if(e.key!=="Enter" && e.key!==" ") return;
      var head=e.target.closest ? e.target.closest(".panel-head") : null;
      if(!head) return;
      e.preventDefault();
      togglePanel(head.getAttribute("data-panel"));

      var vt = e.target.closest("[data-view-panel]");
      if(!vt) return;

      var pid = vt.getAttribute("data-view-panel");
      var cur = getView(pid);
      setView(pid, cur==="compact" ? "list" : "compact");

  function savePanelOrder(){
    var panels = $("app").querySelectorAll(".panel[data-panel-id]");
    var order = [];
    for(var i=0;i<panels.length;i++) order.push(panels[i].getAttribute("data-panel-id"));

    var saved = getPanelOrder();
    if(!saved || !saved.length) return;
    var app = $("app");
    var panels = app.querySelectorAll(".panel[data-panel-id]");
    var map = {};
    panels.forEach(function(p){ map[p.getAttribute("data-panel-id")] = p; });
    saved.forEach(function(id){ if(map[id]) app.appendChild(map[id]); });
  }

  function initDrag(){
    var app = $("app");
    if(!app) return;

    // Pointer events work on both mouse and touch
    app.addEventListener("pointerdown", function(e){
      var handle = e.target.closest(".drag-handle");
      if(!handle) return;
      var panel = handle.closest(".panel[draggable]");
      if(!panel) return;
      e.preventDefault();

      dragState.src = panel;
      dragState.startY = e.clientY;
      dragState.active = false; // activate on move threshold

      // Cache panel positions
      dragState.panels = Array.from(app.querySelectorAll(".panel[data-panel-id]"));
      dragState.offsets = dragState.panels.map(function(p){ return p.getBoundingClientRect(); });

      // Capture pointer so we get events even outside the element
      handle.setPointerCapture(e.pointerId);
    });

    // Use pointermove on document to track movement
    document.addEventListener("pointermove", function(e){
      if(!dragState.src) return;

      // Activate after 5px movement threshold
      if(!dragState.active){
        if(Math.abs(e.clientY - dragState.startY) < 5) return;
        dragState.active = true;
        dragState.src.classList.add("dragging");
        // Create ghost
        var ghost = dragState.src.cloneNode(true);
        ghost.style.cssText = "position:fixed;z-index:9999;pointer-events:none;opacity:.85;width:"+
          dragState.src.offsetWidth+"px;transform:rotate(1deg);box-shadow:0 12px 32px rgba(0,0,0,.2)";
        ghost.className = "panel dragging";
        document.body.appendChild(ghost);
        dragState.ghost = ghost;
      }

      // Move ghost
      if(dragState.ghost){
        dragState.ghost.style.top = (e.clientY - 30) + "px";
        dragState.ghost.style.left = "8px";
      }

      // Highlight target
      var target = findPanelAtY(e.clientY);
      app.querySelectorAll(".panel.drag-over").forEach(function(p){ p.classList.remove("drag-over"); });
      if(target && target !== dragState.src) target.classList.add("drag-over");
    });

    document.addEventListener("pointerup", function(e){
      if(!dragState.src) return;

      if(dragState.active){
        // Drop
        var target = findPanelAtY(e.clientY);
        if(target && target !== dragState.src){
          var rect = target.getBoundingClientRect();
          var mid = rect.top + rect.height / 2;
          if(e.clientY < mid) target.parentNode.insertBefore(dragState.src, target);
          else target.parentNode.insertBefore(dragState.src, target.nextSibling);
          savePanelOrder();
        }
      }

      // Cleanup
      dragState.src.classList.remove("dragging");
      app.querySelectorAll(".panel.drag-over").forEach(function(p){ p.classList.remove("drag-over"); });
      if(dragState.ghost){ dragState.ghost.remove(); dragState.ghost = null; }
      dragState.active = false;
      dragState.src = null;
    });

    document.addEventListener("pointercancel", function(){
      if(dragState.src) dragState.src.classList.remove("dragging");
      app.querySelectorAll(".panel.drag-over").forEach(function(p){ p.classList.remove("drag-over"); });
      if(dragState.ghost){ dragState.ghost.remove(); dragState.ghost = null; }
      dragState.active = false;
      dragState.src = null;
    });

    function findPanelAtY(y){
      for(var i=0;i<dragState.offsets.length;i++){
        var o = dragState.offsets[i];
        if(y >= o.top && y <= o.bottom) return dragState.panels[i];
      }
      return null;
    }
  }

  function parseDf(text){
    // Parse df -h output:
    // Filesystem      Size    Used   Avail Capacity iused ifree %iused  Mounted on
    // /dev/disk3s5   228Gi   184Gi   6.8Gi    97%    2.0M   71M    3%   /System/Volumes/Data
    if(!text) return null;
    var lines = text.trim().split("\n");
    if(lines.length < 2) return null;
    // First data line
    var parts = lines[1].trim().split(/\s+/);
    // Capacity column (4th, 0-indexed) contains "97%" — strip the % and parse
    var capStr = parts[4] || "";
    var pctVal = parseInt(capStr.replace("%",""), 10);
    if(isNaN(pctVal)) pctVal = 0;
    function toBytes(h){
      var n = parseFloat(h);
      if(isNaN(n)) return 0;
      var u = h.replace(/[\d.\s]/g,"").toUpperCase();
      if(u==="K"||u==="KI") return n*1024;
      if(u==="M"||u==="MI") return n*1048576;
      if(u==="G"||u==="GI") return n*1073741824;
      if(u==="T"||u==="TI") return n*1099511627776;
      return n;
    }
    var sB=toBytes(parts[1]), uB=toBytes(parts[2]), aB=toBytes(parts[3]);
    return { size:parts[1], used:parts[2], avail:parts[3], pct:pctVal,
             totalBytes:sB, usedBytes:uB, availBytes:aB };
  }

  function filtered(){
    var q = state.search.trim().toLowerCase();
    var list = (DATA.candidates||[]).filter(function(c){
      if(state.risk!=="all" && c.risk!==state.risk) return false;
      if(q){

        if(hay.indexOf(q)<0) return false;
      }
      return true;
    });
    // Sort by current sort key / direction
    var key = state.sortKey, dir = state.sortDir;
    if(key){
      list.sort(function(a,b){
        var va, vb;
        if(key==="size"){ va=a.size||0; vb=b.size||0; }
        else if(key==="risk"){ var RO={safe:0,aggressive:1,manual:2}; va=RO[a.risk]??9; vb=RO[b.risk]??9; }
        else if(key==="category"){ va=(a.category||"").toLowerCase(); vb=(b.category||"").toLowerCase(); }
        else if(key==="action"){ va=(a.action||"").toLowerCase(); vb=(b.action||"").toLowerCase(); }
        else return 0;
        if(typeof va==="string") return dir * va.localeCompare(vb, "zh");
        return dir * (va - vb);
      });
    }
    return list;
  }

        hint:"如 target，重建耗时 → 判为 aggressive" },
      { id:"ba_bundle_markers", type:"area", label:"安装包后缀名",
        hint:"构建目录内出现这些安装包即降级为待确认；清空会回退内置列表" }
    ]}
  ];

  // Updated in place after a successful save so the panel reflects what was
  // written instead of the config that was inlined at page build time.
  var LIVE_CONFIG = null;
  function cfg(){ return LIVE_CONFIG || CONFIG || DEFAULT_CFG; }
  function arrToText(a){ return (a||[]).join("\n"); }
  function textToArr(s){ return s.split("\n").map(function(x){return x.trim();}).filter(Boolean); }

  var form = null;
  var DRAFT_KEY = "mdc.form.draft";

  function flatConfig(c){
    var t = (c && c.thresholds) || {};
    var ba = (c && c.build_artifacts) || {};
    return {
      stale_days: c.stale_days!=null?c.stale_days:90,
      trash_retention_days: c.trash_retention_days!=null?c.trash_retention_days:30,
      wechat_media_keep_months: c.wechat_media_keep_months!=null?c.wechat_media_keep_months:1,
      thr_app_cache_min_mb: t.app_cache_min_mb!=null?t.app_cache_min_mb:50,
      thr_app_log_min_mb: t.app_log_min_mb!=null?t.app_log_min_mb:10,
      thr_large_dir_mb: t.large_dir_mb!=null?t.large_dir_mb:100,
      thr_large_file_mb: t.large_file_mb!=null?t.large_file_mb:50,
      scan_roots: arrToText(c.scan_roots),
      personal_roots: arrToText(c.personal_roots),
      exclude_paths: arrToText(c.exclude_paths),
      exclude_globs: arrToText(c.exclude_globs),
      protected_projects: arrToText(c.protected_projects),
      protected_categories: arrToText(c.protected_categories),
      ba_safe_dirs: arrToText(ba.safe_dirs),
      ba_aggressive_dirs: arrToText(ba.aggressive_dirs),
      ba_safe_file_globs: arrToText(ba.safe_file_globs),
      ba_tauri_parents: arrToText(ba.tauri_parents),
      ba_tauri_gen_dirs: arrToText(ba.tauri_gen_dirs),
      ba_tauri_build_dirs: arrToText(ba.tauri_build_dirs),
      ba_bundle_markers: arrToText(ba.bundle_markers)
    };
  }

  function loadForm(){
    form = flatConfig(cfg());
    try{
      var draft = JSON.parse(localStorage.getItem(DRAFT_KEY)||"null");
      if(draft && typeof draft==="object"){
        state.hasDraft = true;
        form = Object.assign({}, form, draft);
      } else {
        state.hasDraft = false;
      }
    }catch(e){ state.hasDraft = false; }
  }

  function settingsHtml(){
    var body = SETTINGS_SCHEMA.map(function(sec){
      var head = '<div class="grp">'+esc(sec.group)+
        (sec.groupNote?'<span class="gc">'+esc(sec.groupNote)+'</span>':'')+'</div>';
      if(sec.type==="thr" || (sec.fields[0] && sec.fields[0].type==="thr")){
        return head + '<div class="field"><label>'+esc(sec.group)+'（MB）</label><div class="thr">'+
          sec.fields.map(function(f){ return thrInput(f); }).join("")+
          '</div><span class="hint">'+esc(sec.fields.map(function(f){
            return f.label+"："+f.hint;
          }).join("；"))+'</span></div>';
      }
      return head + sec.fields.map(function(f){
        return f.type==="area" ? fieldArea(f.id, f.label, f.hint) : field(f.id, f.label, f.hint, f.min);
      }).join("");
    }).join("");

    var inner = (state.hasDraft?'<div class="draft-note">已载入上次未保存的草稿，与 config.json 中的值可能不同。'+
          '<a href="#" id="drop-draft">放弃草稿</a></div>':'')+
        '<div class="fld">'+body+'</div>'+
        '<div class="set-actions">'+
          '<button class="btn primary" id="save-btn">'+(state.apiOnline?"保存配置":"生成配置命令")+'</button>'+
          '<button class="btn" id="dl-btn">下载 config.json</button>'+
          '<button class="btn" id="reset-btn">恢复默认</button>'+
          '<span class="status '+(state.statusCls||"idle")+'" id="set-status">'+esc(state.status)+'</span>'+
        '</div>'+
        (state.showCmd?'<div class="cmdbox"><pre id="cmd-pre">'+esc(state.cmdOut)+'</pre>'+
          '<button class="copy-btn" id="copy-btn" aria-label="复制命令">复制</button></div>':'')+
        '<details class="cfg-view"><summary>查看当前生效配置</summary><pre class="cfg-pre">'+esc(JSON.stringify(cfg(),null,2))+'</pre></details>';
    return panel("settings","设置","策略配置 · 保存到 config.json", inner);
  }
  function field(id,label,hint,min){
    return '<div class="field"><label for="f-'+esc(id)+'">'+esc(label)+'</label>'+
      '<input id="f-'+esc(id)+'" type="number" min="'+(min!=null?min:0)+'" step="1" '+
      'inputmode="numeric" value="'+esc(form[id])+'">'+
      (hint?'<span class="hint">'+esc(hint)+'</span>':'')+'</div>';
  }
  function thrInput(f){
    return '<input id="f-'+esc(f.id)+'" type="number" min="0" step="1" inputmode="numeric" '+
      'aria-label="'+esc(f.label)+'" title="'+esc(f.label)+'" value="'+esc(form[f.id])+'">';
  }
  function fieldArea(id,label,hint){
    return '<div class="field"><label for="f-'+esc(id)+'">'+esc(label)+'</label>'+
      '<textarea id="f-'+esc(id)+'" rows="3" spellcheck="false">'+esc(form[id])+'</textarea>'+
      (hint?'<span class="hint">'+esc(hint)+'</span>':'')+'</div>';
  }

  function readForm(){
    function num(id,d,min){ var v=parseInt($("f-"+id).value,10); if(isNaN(v)) v=d; if(v<min) v=min; return v; }
    function area(id){ var el=$("f-"+id); return el?textToArr(el.value):[]; }
    return {
      stale_days: num("stale_days",90,0),
      trash_retention_days: num("trash_retention_days",30,0),
      wechat_media_keep_months: num("wechat_media_keep_months",1,1),
      thresholds:{
        app_cache_min_mb: num("thr_app_cache_min_mb",50,0),
        app_log_min_mb: num("thr_app_log_min_mb",10,0),
        large_dir_mb: num("thr_large_dir_mb",100,0),
        large_file_mb: num("thr_large_file_mb",50,0)
      },
      scan_roots: area("scan_roots"),
      personal_roots: area("personal_roots"),
      exclude_paths: area("exclude_paths"),
      exclude_globs: area("exclude_globs"),
      protected_projects: area("protected_projects"),
      protected_categories: area("protected_categories"),
      build_artifacts:{
        safe_dirs: area("ba_safe_dirs"),
        aggressive_dirs: area("ba_aggressive_dirs"),
        safe_file_globs: area("ba_safe_file_globs"),
        tauri_parents: area("ba_tauri_parents"),
        tauri_gen_dirs: area("ba_tauri_gen_dirs"),
        tauri_build_dirs: area("ba_tauri_build_dirs"),
        bundle_markers: area("ba_bundle_markers")
      }
    };
  }

  // ---- quick actions ----
  function quickExclude(path){
    if(!state.apiOnline){ toast("需要在线模式才能操作", "err"); return; }
    var f = collectForm(false);
    var c = toConfigJson(f);
    if(!c.exclude_paths) c.exclude_paths = [];
    if(c.exclude_paths.indexOf(path)>=0){ toast("路径已在排除列表中"); return; }
    c.exclude_paths.push(path);
    fetch("api/config",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(c)})
      .then(function(r){return r.json();})
      .then(function(j){
        if(j.ok){
          LIVE_CONFIG=c; toast("已排除该路径","ok");
          // Remove from candidate list visually
          DATA.candidates=(DATA.candidates||[]).filter(function(x){return x.path!==path;});
          DATA.candidate_count=(DATA.candidates||[]).length;
          renderMeta(); refreshList();
        } else { toast("保存失败：" +(j.error||""), "err"); }
      }).catch(function(){ toast("网络错误","err"); });
  }
  function quickProtect(project){
    if(!state.apiOnline){ toast("需要在线模式才能操作", "err"); return; }
    var f = collectForm(false);
    var c = toConfigJson(f);
    if(!c.protected_projects) c.protected_projects = [];
    if(c.protected_projects.indexOf(project)>=0){ toast("项目已在保护列表中"); return; }
    c.protected_projects.push(project);
    fetch("api/config",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(c)})
      .then(function(r){return r.json();})
      .then(function(j){
        if(j.ok){
          LIVE_CONFIG=c; toast("已保护该项目","ok");
          DATA.candidates=(DATA.candidates||[]).filter(function(x){return x.path.indexOf(project)!==0;});
          DATA.candidate_count=(DATA.candidates||[]).length;
          renderMeta(); refreshList();
        } else { toast("保存失败：" +(j.error||""), "err"); }
      }).catch(function(){ toast("网络错误","err"); });
  }

  function setStatus(msg, cls){ state.status=msg; state.statusCls=cls||"idle"; var el=$("set-status"); if(el){ el.textContent=msg; el.className="status "+(cls||"idle"); } }

  function collectForm(remember){
    var f = readForm();
    try{
      if(remember!==false) localStorage.setItem(DRAFT_KEY, JSON.stringify(f));
    }catch(e){}
    return f;
  }

  function buildCli(cfgObj){
    // collectForm() already returns nested config.json structure
    var json = JSON.stringify(cfgObj, null, 2);
    var scriptPath = "~/.codex/skills/mac-dev-cleanup/scripts/mac_dev_cleanup.py";
    return "python3 "+scriptPath+" --set-config <<'EOF'\n"+json+"\nEOF";
  }

  function applyConfig(){
    var f = collectForm();
    if(state.apiOnline){
      state.saveBusy=true; syncSaveBtn();
      fetch("api/config", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(f)})
        .then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); })
        .then(function(res){
          state.saveBusy=false; syncSaveBtn();
          if(res.ok){
            LIVE_CONFIG = f; state.hasDraft = false; state.showCmd=false;
            try{ localStorage.removeItem(DRAFT_KEY); }catch(e){}
            setStatus("已保存 ✓", "ok"); toast("配置已保存", "ok");
            rerenderSettings();
          } else {
            var msg = "保存失败：" + (res.j.error || "未知错误");
            setStatus(msg, "err"); toast(msg, "err");
          }
        })
        .catch(function(e){
          state.saveBusy=false; syncSaveBtn();
          setStatus("网络错误：" + e, "err"); toast("网络错误，无法保存", "err");
        });
    } else {
      state.cmdOut = buildCli(f); state.showCmd=true;
      setStatus("已生成命令，复制后在终端执行", "ok");
      toast("已生成命令，复制后在终端执行");
      rerenderSettings();
    }
  }

  // Unflatten the form's flat keys back into the nested structure that
  // config.json actually uses, so the downloaded file is a drop-in replacement.
  function toConfigJson(f){
    var c = {};
    c.stale_days = f.stale_days;
    c.trash_retention_days = f.trash_retention_days;
    c.wechat_media_keep_months = f.wechat_media_keep_months;
    c.thresholds = {
      app_cache_min_mb: f.thr_app_cache_min_mb,
      app_log_min_mb: f.thr_app_log_min_mb,
      large_dir_mb: f.thr_large_dir_mb,
      large_file_mb: f.thr_large_file_mb
    };
    c.scan_roots = f.scan_roots;
    c.personal_roots = f.personal_roots;
    c.exclude_paths = f.exclude_paths;
    c.exclude_globs = f.exclude_globs;
    c.protected_projects = f.protected_projects;
    c.protected_categories = f.protected_categories;
    c.build_artifacts = {
      safe_dirs: f.ba_safe_dirs,
      aggressive_dirs: f.ba_aggressive_dirs,
      safe_file_globs: f.ba_safe_file_globs,
      tauri_parents: f.ba_tauri_parents,
      tauri_gen_dirs: f.ba_tauri_gen_dirs,
      tauri_build_dirs: f.ba_tauri_build_dirs,
      bundle_markers: f.ba_bundle_markers
    };
    return c;
  }

  function downloadConfig(){
    var f = collectForm(false);
    var configObj = toConfigJson(f);
    // Merge with current config as base to preserve any fields not in the form
    var base = cfg();
    var merged = Object.assign({}, base, configObj);
    if(base.thresholds && configObj.thresholds) merged.thresholds = Object.assign({}, base.thresholds, configObj.thresholds);
    if(base.build_artifacts && configObj.build_artifacts) merged.build_artifacts = Object.assign({}, base.build_artifacts, configObj.build_artifacts);
    var blob = new Blob([JSON.stringify(merged, null, 2)], {type:"application/json"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "config.json";
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 100);
  }

  function resetConfig(){
    LIVE_CONFIG = null;
    try{ localStorage.removeItem(DRAFT_KEY); }catch(e){}
    state.showCmd=false; state.hasDraft=false;
    loadForm();
    setStatus("");
    rerenderSettings();
    toast("已恢复为 config.json 中的值");
  }

  function dropDraft(){
    try{ localStorage.removeItem(DRAFT_KEY); }catch(e){}
    state.hasDraft=false;
    loadForm();
    setStatus("");
    rerenderSettings();
  }

  function syncSaveBtn(){
    var b=$("save-btn"); if(b) b.textContent = state.saveBusy ? "保存中…" : (state.apiOnline?"保存配置":"生成配置命令");
  }

  // ---- scan (API) ----
  function runScan(){
    if(!state.apiOnline || state.scanBusy) return;
    state.scanBusy=true; var b=$("scan-btn"); if(b){ b.disabled=true; b.textContent="扫描中…"; }
    fetch("api/scan", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({mode:"scan"})})
      .then(function(r){ return r.json(); })
      .then(function(j){
        state.scanBusy=false;
        if(b){ b.disabled=false; b.textContent="重新扫描"; }
        if(j.ok && j.state){
          // Update in-place without reload, preserving user state
          Object.assign(DATA, j.state);
          if(j.state.config) Object.assign(CONFIG, j.state.config);
          loadForm();
          renderMeta();
          renderAll();
          loadOperations();
          loadTrash();
          toast("扫描完成，共 " + (DATA.candidate_count||0) + " 个候选", "ok");
        } else if(j.ok){
          location.reload();
        } else {
          var msg = "扫描失败：" + (j.error || "未知错误");
          setStatus(msg, "err"); toast(msg, "err");
        }
      })
      .catch(function(e){
        state.scanBusy=false;
        if(b){ b.disabled=false; b.textContent="重新扫描"; }
        setStatus("网络错误：" + e, "err"); toast("网络错误，无法扫描", "err");
      });
  }

  // ---- operations history ----
  var OPERATIONS = [];
  var TRASH = {total_bytes:0, operations:[]};

  function loadOperations(){
    if(typeof fetch!=="function") return;
    fetch("api/operations",{cache:"no-store"}).then(function(r){return r.json();})
      .then(function(j){ OPERATIONS=j.operations||[]; renderOperations(); renderLastCleanup(); })
      .catch(function(){});
  }
  function loadTrash(){
    if(typeof fetch!=="function") return;
    fetch("api/trash",{cache:"no-store"}).then(function(r){return r.json();})
      .then(function(j){ TRASH=j; renderTrash(); })
      .catch(function(){});
  }
  function clearTrash(){
    if(!confirm("确定要清空废纸篓中的所有隔离文件？\n清空后无法通过操作历史还原。")) return;
    fetch("api/trash/clear",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"})
      .then(function(r){return r.json();})
      .then(function(j){
        if(j.ok){
          toast("已清空 "+j.deleted+" 个操作目录，释放 "+fmtSize(j.freed_bytes),"ok");
          loadTrash();
        } else { toast("清空失败："+(j.error||""),"err"); }
      }).catch(function(){ toast("网络错误","err"); });
  }

  function renderTrash(){
    var el=$("trash-info"); if(!el) return;
    if(!state.apiOnline) return;  // Keep placeholder until API loads
    if(!TRASH.total_bytes){
      el.innerHTML='<span class="lbl">隔离区</span><span class="val c-slate" style="font-size:16px">0</span><span class="sub">无隔离文件</span>';
      return;
    }
    el.innerHTML='<span class="lbl">隔离区</span>'+
      '<span class="val c-slate" style="font-size:16px">'+fmtSize(TRASH.total_bytes)+'</span>'+
      '<span class="sub">'+TRASH.operations.length+' 个操作目录</span>'+
      (state.apiOnline?'<button class="btn" style="margin-top:4px;height:24px;font-size:10px" id="clear-trash-btn">清空废纸篓</button>':'');
    var btn=$("clear-trash-btn"); if(btn) btn.addEventListener("click",clearTrash);
  }

  function renderOperationsInner(){
    // Body shell with an empty ops-list placeholder (filled async by renderOperations)
    return '<div id="ops-list"><div class="empty">加载中…</div></div>';
  }

  function renderOperations(){
    var el=$("ops-list"); if(!el) return;
    if(!OPERATIONS.length){ el.innerHTML='<div class="empty">暂无操作记录</div>'; return; }
    el.innerHTML=OPERATIONS.slice(0,10).map(function(op){
      var t=op.timestamp?op.timestamp.replace("T"," ").slice(0,16):"";
      var modeLabel=MODE_ZH[op.mode]||op.mode;
      return '<div class="ops-row">'+
        '<span class="ops-time">'+esc(t)+'</span>'+
        '<span class="tag tag-'+(op.mode==="clean-safe"?"safe":"aggressive")+'">'+esc(modeLabel)+'</span>'+
        '<span class="ops-count">'+op.entry_count+' 项</span>'+
        '<span class="ops-size">'+fmtSize(op.total_bytes)+'</span>'+
        '<button class="ra-btn ops-restore copyable" data-copy="'+esc(op.restore_command)+'" title="复制还原命令" aria-label="还原">↺</button>'+
      '</div>';
    }).join("");
    var btns=el.querySelectorAll(".ops-restore");
    for(var i=0;i<btns.length;i++){
      btns[i].addEventListener("click",function(e){
        e.stopPropagation();
        copyText(this.getAttribute("data-copy"),"还原命令已复制");
      });
    }
  }

  // ---- render orchestration ----
  function renderAll(){
    var app = $("app");
    if(!DATA){
      app.innerHTML = "";
      $("boot-error").classList.add("show");
      return;
    }
    $("boot-error").classList.remove("show");
    // panel() is the unified collapsible shell; each renderXxx supplies its body.
    var html =
      panel("summary","概览",(DATA.candidate_count||0)+" 个候选", renderSummaryInner()) +

      panel("cat","类别容量", catNote(), renderCatInner(), true) +

      panel("disk","磁盘空间","清理前 / 清理后", renderDiskInner(), true) +

      panel("ops","操作历史","最近操作 · 可还原", renderOperationsInner(), true) +

    app.innerHTML = html;

  // Only the result list is swapped. Rebuilding the whole card (as the previous
  // version did) destroyed the search input on every keystroke, which dropped
  // focus and broke IME composition.
  function refreshList(){
    var list = filtered();
    var holder = $("listview");
    if(holder) holder.innerHTML = views(list);
    var count = $("count");
    if(count) count.textContent = list.length + " / " + ((DATA.candidates||[]).length);
    var chips = $("chips");
    if(chips) chips.innerHTML = chipsHtml();
  }

  function bindTable(){
    var si = $("search-input");
    if(si) si.addEventListener("input", function(e){ state.search=e.target.value; refreshList(); });
    var chips = $("chips");
    if(chips) chips.addEventListener("click", function(e){
      var b=e.target.closest("[data-risk]"); if(!b) return;
      state.risk=b.getAttribute("data-risk"); refreshList();
    });
    var holder = $("listview");
    if(holder) holder.addEventListener("click", function(e){
      // Sort header click
      var th = e.target.closest("[data-sort]");
      if(th){
        var key = th.getAttribute("data-sort");
        if(state.sortKey===key) state.sortDir *= -1;
        else { state.sortKey=key; state.sortDir = key==="size"?-1:1; }
        refreshList();
        return;
      }
      // Quick exclude/protect
      var btn = e.target.closest("[data-action]");
      if(btn){
        var action = btn.getAttribute("data-action");
        var path = btn.getAttribute("data-path");
        var project = btn.getAttribute("data-project");
        if(action==="exclude" && path) quickExclude(path);
        else if(action==="protect" && project) quickProtect(project);
        return;
      }
      // Path copy click
      var el = e.target.closest("[data-copy]"); if(!el) return;
      copyText(el.getAttribute("data-copy"), "路径已复制");
    });
    // Risk distribution panel → filter
    var riskRows = document.querySelectorAll(".risk-row.clickable");
    for(var i=0;i<riskRows.length;i++){
      riskRows[i].addEventListener("click", function(){
        state.risk = this.getAttribute("data-risk") || "all";
        refreshList();
      });
    }
    // Category panel → search
    var catRows = document.querySelectorAll(".cat-row.clickable");
    for(var i=0;i<catRows.length;i++){
      catRows[i].addEventListener("click", function(){
        var cat = this.getAttribute("data-cat");
        state.search = cat || "";
        var si = $("search-input");
        if(si) si.value = state.search;
        refreshList();
      });
    }
    // Tool install copy
    var toolInstalls = document.querySelectorAll(".tool-install");
    for(var i=0;i<toolInstalls.length;i++){
      toolInstalls[i].addEventListener("click", function(e){
        e.stopPropagation();
        copyText(this.getAttribute("data-copy"), "安装命令已复制");
      });
    }
  }

  function bindSettings(){
    var sb=$("save-btn"); if(sb) sb.addEventListener("click", applyConfig);
    var dl=$("dl-btn"); if(dl) dl.addEventListener("click", downloadConfig);
    var rb=$("reset-btn"); if(rb) rb.addEventListener("click", resetConfig);
    var dd=$("drop-draft"); if(dd) dd.addEventListener("click", function(e){ e.preventDefault(); dropDraft(); });
    var cb=$("copy-btn"); if(cb) cb.addEventListener("click", function(){
      copyText(state.cmdOut, "命令已复制");
    });
  }
  function rerenderSettings(){
    // Rebuild settings panel only — find by data-panel attribute
    var oldPanel = document.querySelector('[data-panel="settings"]');
    if(!oldPanel) return;
    var oldSection = oldPanel.closest(".panel");
    if(!oldSection) return;
    var ns=document.createElement("div");
    ns.innerHTML=settingsHtml();
    var newSection = ns.querySelector(".panel");
    if(newSection) oldSection.parentNode.replaceChild(newSection, oldSection);
    bindSettings();
  }

  // ---- boot ----
  function detectApi(){
    // jsdom / very old browsers have no fetch: without this guard the missing
    // global throws an uncaught ReferenceError instead of degrading quietly.
    if(typeof fetch !== "function") return;
    var probe;
    try{
      probe = fetch("api/health", {cache:"no-store"});
    }catch(e){ return; }
    probe.then(function(r){
      if(!r.ok) return;
      state.apiOnline=true;
      var d=$("api-dot"); if(d) d.classList.add("on");
      var t=$("api-text"); if(t) t.textContent="接口已连接";
      var sb=$("scan-btn"); if(sb){ sb.disabled=false; sb.title="重新执行只读扫描"; }
      syncSaveBtn();
    }).catch(function(){ /* offline: static view */ });
  }

  function boot(){
    bindPanels();  // event delegation — must be called once, before any render
    if(!DATA){ renderAll(); return; }
    loadForm();
    renderMeta();
    renderAll();
    detectApi();
    loadOperations();
    loadTrash();
  }

  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
</body>
</html>
